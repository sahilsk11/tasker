name: SAS redeploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: sas-redeploy-tasker-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  redeploy:
    name: Redeploy Tasker on SAS
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Send signed SAS deploy webhook
        env:
          SAS_DEPLOY_WEBHOOK_SECRET: ${{ secrets.SAS_DEPLOY_WEBHOOK_SECRET }}
          SAS_DEPLOY_WEBHOOK_URL: https://webhooks-sahil.ultron.sh/github-tasker
        run: |
          node <<'NODE'
          const { createHmac, randomUUID } = require("node:crypto");

          const secret = process.env.SAS_DEPLOY_WEBHOOK_SECRET;
          const webhookUrl = process.env.SAS_DEPLOY_WEBHOOK_URL;
          if (!secret) {
            throw new Error("SAS_DEPLOY_WEBHOOK_SECRET is not configured");
          }
          if (!webhookUrl) {
            throw new Error("SAS_DEPLOY_WEBHOOK_URL is not configured");
          }

          async function main() {
            const payload = {
              ref: "refs/heads/main",
              repository: {
                full_name: "sahilsk11/tasker"
              }
            };
            const body = JSON.stringify(payload);
            const signature = `sha256=${createHmac("sha256", secret).update(body).digest("hex")}`;

            const response = await fetch(webhookUrl, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "User-Agent": "tasker-sas-redeploy",
                "X-GitHub-Delivery": randomUUID(),
                "X-GitHub-Event": "push",
                "X-Hub-Signature-256": signature
              },
              body
            });

            if (!response.ok) {
              const responseBody = await response.text();
              throw new Error(`SAS deploy webhook failed: ${response.status} ${responseBody}`);
            }
          }

          main().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
