name = "tasker"
main = "src/cloudflare.ts"
compatibility_date = "2026-11-03"
compatibility_flags = ["nodejs_compat"]
account_id = "0aac5310338965632a15a7a52173813a"
workers_dev = false
preview_urls = false
routes = [{ pattern = "tasker.ultron.sh", custom_domain = true }]

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api", "/api/*", "/health"]

[[d1_databases]]
binding = "DB"
database_name = "tasker"
# The deploy workflow replaces this local ID with the Terraform output.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "d1/migrations"
